<main class="page">
  <div class="glow" aria-hidden="true"></div>

  <section class="card">
    <div class="logo" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <p class="badge">🚧 Site en construction</p>

    <h1>{{ title() }}</h1>
    <p class="tagline">
      Quelque chose de chouette se prépare. Revenez bientôt !
    </p>

    <div class="progress" role="progressbar" aria-label="Avancement du chantier">
      <div class="bar"></div>
    </div>

    <div class="health">
      <button type="button" (click)="onTriggerBackendHealthCheck()">
       Réveille moi
      </button>
      <span class="status" [class.up]="checked() && isUp()" [class.down]="checked() && !isUp()">
        <span
          class="dot"
          [class.up]="isUp()"
          [class.down]="checked() && !isUp()"></span>
        @if (!checked()) { 🤖💤 }
        @else if (isUp()) { 🤖}
        @else { 🤖💥 }
      </span>
    </div>
  </section>

  <router-outlet />
</main>
