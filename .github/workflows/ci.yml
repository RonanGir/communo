name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: [ "*" ]
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./frontend
      - run: mise run build
      - run: mise run test:unit-test

  backend-test:
    name: backend (test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./backend
      - run: mise run test:unit-test

  docker-build:
    name: docker (dry-run build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Adapte le chemin si ton Dockerfile est à la racine (./Dockerfile)
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ frontend, backend-test, docker-build ]
    if: github.ref == 'refs/heads/main'
    environment: Communo_production
    strategy:
      matrix:
        project: [ backend ]
        include:
          - project: backend
            hook: RENDER_DEPLOY_API_COMMUNO_HOOK
    steps:
      - name: Déclencher le déploiement Render
        env:
          HOOK_URL: ${{ secrets[matrix.hook] }}
        run: curl --fail --silent --show-error -X POST "$HOOK_URL"