name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: [ "*" ]
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [ backend, frontend ]
    defaults:
      run:
        working-directory: ./${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.project == 'frontend'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./${{ matrix.project }}
      - run: mise run build

  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [ backend, frontend ]
    defaults:
      run:
        working-directory: ./${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.project == 'frontend'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./${{ matrix.project }}
      - run: mise run test:unit-test

  deploy:
    name: deploy (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ build, test ]
    #if: startsWith(github.ref, 'refs/tags/')
    if: github.ref == 'refs/heads/main'
    environment: Communo_production
    strategy:
      matrix:
        project: [ backend, frontend ]
        include:
            - project: backend
              hook: RENDER_DEPLOY_API_COMMUNO_HOOK
            - project: frontend
              hook: RENDER_DEPLOY_UI_COMMUNO_HOOK
    steps:
      - name: Déclencher le déploiement Render
        env:
          # Le secret passe par une variable d'env : jamais interpolé dans la commande.
          HOOK_URL: ${{ secrets[matrix.hook] }}
        # --fail : curl sort en erreur si Render répond 4xx/5xx
        # --silent --show-error : pas de bruit, mais l'erreur reste visible
        run: curl --fail --silent --show-error -X POST "$HOOK_URL"
